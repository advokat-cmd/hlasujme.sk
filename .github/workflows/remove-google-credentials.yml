name: Remove Obsolete Google Credentials

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REMOVE_GOOGLE_CREDENTIALS to continue"
        required: true
        type: string

jobs:
  remove:
    if: inputs.confirm == 'REMOVE_GOOGLE_CREDENTIALS'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Back up environment and remove obsolete credentials
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail

            BASE_ENV=/var/www/hlasovanie/.env
            CURRENT_DIR="$(readlink -f /var/www/hlasovanie-current)"
            CURRENT_ENV="$CURRENT_DIR/.env"
            BACKUP_DIR=/var/backups/hlasujme
            TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"

            test -f "$BASE_ENV"
            test -f "$CURRENT_ENV"
            install -d -m 700 "$BACKUP_DIR"
            install -m 600 "$BASE_ENV" "$BACKUP_DIR/env-before-google-removal-$TIMESTAMP"
            install -m 600 "$CURRENT_ENV" "$BACKUP_DIR/current-env-before-google-removal-$TIMESTAMP"

            sed -i -E '/^(GOOGLE_SERVICE_ACCOUNT_EMAIL|GOOGLE_PRIVATE_KEY|GOOGLE_DRIVE_PARENT_FOLDER_ID)=/d' "$BASE_ENV"
            sed -i -E '/^(GOOGLE_SERVICE_ACCOUNT_EMAIL|GOOGLE_PRIVATE_KEY|GOOGLE_DRIVE_PARENT_FOLDER_ID)=/d' "$CURRENT_ENV"
            chmod 600 "$BASE_ENV" "$CURRENT_ENV"

            if grep -Eq '^(GOOGLE_SERVICE_ACCOUNT_EMAIL|GOOGLE_PRIVATE_KEY|GOOGLE_DRIVE_PARENT_FOLDER_ID)=' "$BASE_ENV" "$CURRENT_ENV"; then
              echo "Obsolete Google credentials are still present" >&2
              exit 1
            fi

            systemctl restart hlasovanie
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/admin/login >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "Application health check failed after credential removal" >&2
                exit 1
              fi
              sleep 1
            done
            systemctl is-active --quiet hlasovanie
            echo "Obsolete Google credentials removed; protected backups retained in $BACKUP_DIR"
