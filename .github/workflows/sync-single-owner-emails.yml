name: Sync Single Owner Emails

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Synchronize single-owner unit and owner emails in production"
        required: true
        type: boolean
        default: false
      confirm:
        description: "For apply, type SYNC_SINGLE_OWNER_EMAILS"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    env:
      SYNC_APPLY: ${{ inputs.apply }}
      SYNC_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Inspect, back up, and optionally synchronize emails
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          envs: SYNC_APPLY,SYNC_CONFIRM
          script: |
            set -euo pipefail
            CURRENT_DIR="$(readlink -f /var/www/hlasovanie-current)"
            cd "$CURRENT_DIR"
            git fetch origin main --quiet
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

            DATABASE_URL="$(node -r dotenv/config -e 'process.stdout.write(process.env.DATABASE_URL || "")')"
            export DATABASE_URL
            node -e 'const u=new URL(process.env.DATABASE_URL);if(u.pathname.replace(/^\//,"")!=="lemon"||u.searchParams.get("schema")!=="hlasujme")throw new Error("Refusing sync outside lemon/hlasujme")'
            npm run maintenance:sync-single-owner-emails

            if [ "$SYNC_APPLY" = "true" ]; then
              test "$SYNC_CONFIRM" = "SYNC_SINGLE_OWNER_EMAILS"
              PG_URL="$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.delete("schema");process.stdout.write(u.toString())')"
              BACKUP_DIR=/var/backups/hlasujme
              install -d -m 700 "$BACKUP_DIR"
              BACKUP_FILE="$BACKUP_DIR/before-single-owner-email-sync-$(date -u +%Y%m%dT%H%M%SZ).dump"
              pg_dump --dbname="$PG_URL" --schema=hlasujme --format=custom --file="$BACKUP_FILE"
              chmod 600 "$BACKUP_FILE"
              test -s "$BACKUP_FILE"

              export CONFIRM_SINGLE_OWNER_EMAIL_SYNC=SYNC_SINGLE_OWNER_EMAILS
              npm run maintenance:sync-single-owner-emails -- --apply
              npm run maintenance:sync-single-owner-emails
              echo "Single-owner emails synchronized; protected backup retained in $BACKUP_FILE"
            fi
