name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hlasujme-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy safely via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            SOURCE_DIR=/var/www/hlasovanie
            RELEASES_DIR=/var/www/hlasovanie-releases
            CURRENT_LINK=/var/www/hlasovanie-current
            RELEASE_DIR=""
            PREVIOUS_TARGET=""
            SWITCHED=false
            cleanup_failed_release() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                set +e
                if [ "$SWITCHED" = "true" ] && [ -n "$PREVIOUS_TARGET" ] && [ -d "$PREVIOUS_TARGET" ]; then
                  rm -f -- "$CURRENT_LINK.rollback"
                  ln -s "$PREVIOUS_TARGET" "$CURRENT_LINK.rollback"
                  mv -Tf "$CURRENT_LINK.rollback" "$CURRENT_LINK"
                  systemctl restart hlasovanie
                  SWITCHED=false
                fi
                live_target="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
                if [ -n "$live_target" ] && [ -n "$RELEASE_DIR" ] && [ -d "$RELEASE_DIR" ] && [ "$live_target" != "$RELEASE_DIR" ]; then
                  case "$RELEASE_DIR" in
                    "$RELEASES_DIR"/*) ;;
                    *) echo "Refusing failed-release cleanup outside $RELEASES_DIR"; exit "$status" ;;
                  esac
                  cd "$SOURCE_DIR"
                  git -c safe.directory="$SOURCE_DIR" worktree remove --force "$RELEASE_DIR" 2>/dev/null || rm -rf -- "$RELEASE_DIR"
                  git -c safe.directory="$SOURCE_DIR" worktree prune
                fi
              fi
              exit "$status"
            }
            trap cleanup_failed_release EXIT
            cd "$SOURCE_DIR"
            install -d -m 755 "$RELEASES_DIR"
            CURRENT_TARGET="$(readlink -f "$CURRENT_LINK")"
            test -n "$CURRENT_TARGET"
            test -d "$CURRENT_TARGET"
            PREVIOUS_TARGET="$CURRENT_TARGET"
            find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' candidate; do
              resolved="$(readlink -f "$candidate" 2>/dev/null || true)"
              [ -n "$resolved" ] || continue
              case "$resolved" in
                "$RELEASES_DIR"/*) ;;
                *) echo "Refusing release cleanup outside $RELEASES_DIR"; exit 1 ;;
              esac
              if [ "$resolved" != "$CURRENT_TARGET" ]; then
                git -c safe.directory="$SOURCE_DIR" worktree remove --force "$resolved" 2>/dev/null || rm -rf -- "$resolved"
              fi
            done
            git -c safe.directory="$SOURCE_DIR" worktree prune
            git -c safe.directory="$SOURCE_DIR" fetch origin main
            git -c safe.directory="$SOURCE_DIR" checkout main
            git -c safe.directory="$SOURCE_DIR" reset --hard origin/main
            RELEASE_SHA="$(git -c safe.directory="$SOURCE_DIR" rev-parse origin/main)"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA-$(date -u +%Y%m%dT%H%M%SZ)"
            git -c safe.directory="$SOURCE_DIR" worktree add --detach "$RELEASE_DIR" "$RELEASE_SHA"
            install -m 600 "$SOURCE_DIR/.env" "$RELEASE_DIR/.env"
            cd "$RELEASE_DIR"

            npm ci --include=dev

            DATABASE_URL="$(node -r dotenv/config -e 'process.stdout.write(process.env.DATABASE_URL || "")')"
            export DATABASE_URL
            node - <<'NODE'
            const url = new URL(process.env.DATABASE_URL);
            const database = url.pathname.replace(/^\//, "");
            const schema = url.searchParams.get("schema");
            if (database !== "lemon" || schema !== "hlasujme") {
              throw new Error("Refusing deploy: DATABASE_URL must target database lemon and schema hlasujme");
            }
            NODE

            PG_URL="$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.delete("schema");process.stdout.write(u.toString())')"

            BACKUP_DIR=/var/backups/hlasujme
            install -d -m 700 "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/hlasujme-$(date -u +%Y%m%dT%H%M%SZ).dump"
            pg_dump --dbname="$PG_URL" --schema=hlasujme --format=custom --file="$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            test -s "$BACKUP_FILE"

            npx prisma migrate deploy
            export NODE_OPTIONS="--max-old-space-size=3072"
            npm run build

            PREVIOUS_TARGET="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
            test -n "$PREVIOUS_TARGET"
            test -d "$PREVIOUS_TARGET"
            rm -f -- "$CURRENT_LINK.new"
            ln -s "$RELEASE_DIR" "$CURRENT_LINK.new"
            mv -Tf "$CURRENT_LINK.new" "$CURRENT_LINK"
            SWITCHED=true
            install -d -m 755 /etc/systemd/system/hlasovanie.service.d
            printf '%s\n' '[Service]' 'WorkingDirectory=/var/www/hlasovanie-current' > /etc/systemd/system/hlasovanie.service.d/release.conf
            systemctl daemon-reload
            systemctl restart hlasovanie
            systemctl is-active --quiet hlasovanie
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3001/admin/login >/dev/null; then
                exit 0
              fi
              if [ "$attempt" = "30" ]; then
                echo "Production health check failed after 30 attempts"
                exit 1
              fi
              sleep 1
            done
